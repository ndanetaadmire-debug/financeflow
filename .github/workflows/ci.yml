name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema and prove the database rejects an unbalanced transaction
        env:
          DB: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -f migrations/001_ledger.sql
          psql "$DB" -v ON_ERROR_STOP=1 -c "INSERT INTO accounts (id, owner_id, name, type, currency, allow_overdraft) VALUES ('a','x','A','asset','ZAR',true), ('b','y','B','liability','ZAR',false);"
          if psql "$DB" -v ON_ERROR_STOP=1 -c "BEGIN; INSERT INTO transactions (id, idempotency_key, request_hash, kind, currency) VALUES ('t','k','h','transfer','ZAR'); INSERT INTO postings VALUES ('t',0,'a',-100); COMMIT;"; then
            echo "unbalanced transaction was accepted"; exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t financeflow:ci .
